name: homelab-command-center
services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./web-dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    mem_limit: 96m
  api:
    build: ./server
    restart: unless-stopped
    volumes:
      - rack_data:/data
    mem_limit: 128m
volumes:
  rack_data:
