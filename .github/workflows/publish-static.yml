name: Publish Command Center static frontend

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'visual.html'
      - 'visual-nginx.conf'
      - 'docker-compose.visual.yml'
      - 'tsconfig*.json'
      - 'vite.config.*'
      - '.github/workflows/publish-static.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homelab-static-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
      - name: Test STL to GLB converter
        run: python3 -m unittest discover -s server -p 'test_model_conversion.py'
      - name: Typecheck and build
        run: npm run build
      - name: Verify bundle
        run: |
          test -s dist/index.html
          test -s dist/visual.html
          test -n "$(find dist/assets -maxdepth 1 -name '*.js' -print -quit)"
      - name: Publish compiled files to static branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/hcc-static"
          cp -a dist/. "$RUNNER_TEMP/hcc-static/"
          cd "$RUNNER_TEMP/hcc-static"
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b static
          git add -A
          git commit -m "deploy: $SOURCE_SHA"
          git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push --force origin HEAD:refs/heads/static
