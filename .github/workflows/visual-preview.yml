name: Browser screenshot QA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Install browser runner
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Compile
        run: npm run build
      - name: Launch site and capture actual WebGL scene
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/hcc-preview.log 2>&1 &
          node scripts/capture-visual.mjs
      - name: Save screenshot as readable preview data
        if: always()
        run: |
          if [ -f visual-artifacts/rack-showcase.png ]; then base64 -w 0 visual-artifacts/rack-showcase.png > visual-artifacts/rack-showcase.b64; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rack-visual
          path: visual-artifacts/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Publish visual screenshot branch
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: visual-preview
          publish_dir: ./visual-artifacts
          force_orphan: true
          enable_jekyll: false
